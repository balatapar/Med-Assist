# Force LIGHT theme on every device/browser.
# Without this, Streamlit follows the OS dark-mode and our light-designed
# palette becomes unreadable (faint gray text on dark surfaces).
[theme]
base = "light"
primaryColor = "#0d9488"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
